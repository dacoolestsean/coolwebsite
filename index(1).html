    filter: blur(14px) brightness(.55);
    z-index: -2;
  }
  #stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

  .card {
    width: min(720px, 100%);
    padding: 36px 32px 28px;
    border-radius: 28px;
    background: rgba(20, 20, 22, .55);
    border: 1px solid rgba(255,255,255,.07);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    text-align: center;
    position: relative;
    animation: rise .7s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .pfp-wrap { position: relative; width: 136px; height: 136px; margin: 0 auto 14px; }
  .pfp {
    width: 100%; height: 100%; border-radius: 50%;
    object-fit: cover; display: block;
    box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 8px 30px rgba(130,60,200,.35);
  }
  .bubble {
    position: absolute; top: -8px; right: -22px;
    width: 54px; height: 54px; border-radius: 50%;
    background: #fff; color: #222;
    display: grid; place-items: center;
    font-size: 18px; font-weight: 700; letter-spacing: -1px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .bubble::after {
    content: ""; position: absolute; left: 4px; bottom: 2px;
    width: 12px; height: 12px; background: #fff; border-radius: 50%;
  }

  h1 {
    font-size: clamp(34px, 7vw, 46px); font-weight: 700; letter-spacing: -.5px;
    background: linear-gradient(90deg, var(--accent2), var(--accent1), var(--accent2));
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% 0; } }

  .bio { margin: 14px auto 18px; max-width: 30em; font-size: 19px; font-weight: 500; line-height: 1.5; }
  .loc { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--muted); }
  .loc svg { width: 16px; height: 16px; fill: currentColor; }

  .views {
    position: absolute; left: 24px; bottom: 20px;
    display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 600;
  }
  .views svg { width: 20px; height: 20px; fill: currentColor; }
  .spacer { height: 40px; }

  @media (prefers-reduced-motion: reduce) { .card, h1 { animation: none; } }
</style>
</head>
<body>
  <div class="bg"></div>
  <canvas id="stars"></canvas>

<script>
  // view counter (counts visits on this browser only)
  try {
    const n = (parseInt(localStorage.getItem('views') || '0', 10)) + 1;
    localStorage.setItem('views', n);
    document.getElementById('count').textContent = n;
  } catch (e) {}

  // twinkling stars
  const c = document.getElementById('stars'), ctx = c.getContext('2d');
  let stars = [];
  function resize() {
    c.width = innerWidth; c.height = innerHeight;
    stars = Array.from({ length: Math.round(innerWidth * innerHeight / 14000) }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: Math.random() * 1.6 + .4, s: Math.random() * .02 + .005, p: Math.random() * 6.28
    }));
  }
  addEventListener('resize', resize); resize();
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const s of stars) {
      ctx.globalAlpha = still ? .8 : .35 + .65 * Math.abs(Math.sin(t * s.s * .1 + s.p));
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    if (!still) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
